# Kafka 4.3 in KRaft combined mode (broker + controller), one node on the lab host — no ZooKeeper.
process.roles=broker,controller
node.id=1
# Kafka 4 dynamic quorum (kafka-storage format --standalone); "voters" is the old static form and is refused
controller.quorum.bootstrap.servers=localhost:9093
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
log.dirs=/home/huy/opt/cdc/data/kafka
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
# small lab host: keep 1 day / 1 GB of change events
log.retention.hours=24
log.retention.bytes=1073741824
