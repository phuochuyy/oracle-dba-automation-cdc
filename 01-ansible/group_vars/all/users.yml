# Database roles and users wanted in the lab (desired state). Passwords: vault_user_passwords (vault.yml).
db_roles:
  - name: bank_read
    pdb: secpdb
    host: prm1
    object_grants:            # SELECT only; CARDS.PAN stays redacted for this role (no CARD_FULL_VIEW)
      - select on bank.branches
      - select on bank.customers
      - select on bank.accounts
      - select on bank.cards
      - select on bank.transactions

  - name: cdc_rw
    pdb: ggrepl
    host: prm3
    object_grants:
      - insert on app.cdc_events
      - update on app.cdc_events
      - delete on app.cdc_events
      - select on app.cdc_events
  - name: cdc_ro
    pdb: orclpdb2
    host: prm1
    object_grants:
      - select on app.cdc_events

db_users:
  - name: report_ro
    pdb: secpdb
    host: prm1
    profile: sec_admin_profile
    roles: [bank_read]
    system_privs: [create session]

  # read-only monitoring user for the Python daily report (02-python): dictionary views, audit trail
  # (no SELECT ANY DICTIONARY — the security lab's assessment flags it)
  - name: c##mon
    pdb: cdb$root
    host: prm1
    profile: c##svc_profile        # created by the security lab (no expiry: password in a vault)
    roles: [select_catalog_role, audit_viewer]
    system_privs: [create session]
    container_data: all
  - name: c##mon
    pdb: cdb$root
    host: prm3
    profile: default               # Region B was not hardened (see 01-ansible health check)
    roles: [select_catalog_role, audit_viewer]
    system_privs: [create session]
    container_data: all

  # CDC lab (03-cdc): a writer on the source side, a reader on the GoldenGate target side
  - name: cdc_writer
    pdb: ggrepl
    host: prm3
    profile: default
    roles: [cdc_rw]
    system_privs: [create session]
  - name: cdc_reader
    pdb: orclpdb2
    host: prm1
    profile: default
    roles: [cdc_ro]
    system_privs: [create session]
