[defaults]
inventory = inventory.ini
roles_path = roles
# the lab never runs all 8 VMs (23 GB host): hosts that are off are reported, not fatal
forks = 8
timeout = 10
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
# group_vars/all/vault.yml is loaded by EVERY playbook: without this, health.yml failed with "Attempting to
# decrypt but no vault secrets found" once the vault existed. Path to a file outside the repo (mode 600).
vault_password_file = ~/.vault_pass_dba

[ssh_connection]
# host aliases, IPs and host-key policy come from ~/.ssh/config (same names as labctl.sh)
pipelining = true
