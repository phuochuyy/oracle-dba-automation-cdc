[defaults]
inventory = inventory.ini
roles_path = roles
# the lab never runs all 8 VMs (23 GB host): hosts that are off are reported, not fatal
forks = 8
timeout = 10
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent

[ssh_connection]
# host aliases, IPs and host-key policy come from ~/.ssh/config (same names as labctl.sh)
pipelining = true
