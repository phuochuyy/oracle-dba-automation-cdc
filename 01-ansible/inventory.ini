# Lab inventory — host names are the ~/.ssh/config aliases. No passwords here (see group_vars/all/vault.yml).
# Region A: RAC primary orcl -> RAC standby orcl_stb, observer obs-r1
# Region B: single instance orcl3 -> ORCL3_STB, observer obs-r2

[rac_primary]
prm1 oracle_sid=orcl1
prm2 oracle_sid=orcl2

[rac_standby]
stb1 oracle_sid=orcl_stb1
stb2 oracle_sid=orcl_stb2

[si]
prm3 oracle_sid=ORCL3
stb3 oracle_sid=ORCL3_STB

[observers]
obs-r1
obs-r2

[region_a]
prm1
prm2
stb1
stb2
obs-r1

[region_b]
prm3
stb3
obs-r2

[rac:children]
rac_primary
rac_standby

[db:children]
rac
si

[db:vars]
ansible_user=oracle
oracle_home=/u01/app/oracle/product/23.26.0/dbhome_1

[rac:vars]
grid_home=/u01/app/23.26.0/grid

[observers:vars]
ansible_user=oracle
oracle_home=/u01/app/oracle/product/23.26.0/client

# hosts whose control file records the backups (RAC A: offloaded to the standby; region B: on the primary)
[backup_hosts]
stb1
stb2
prm3
